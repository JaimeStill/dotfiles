[settings]
idiomatic_version_file_enable_tools = ["ruby"]
minimum_release_age="0"
# Omarchy 4.5 declares claude and codex in /etc/mise/conf.d/omarchy-tools.toml;
# claude stays native (~/.local/share/claude) and codex stays uninstalled.
disable_tools = ["claude", "codex"]

[settings.ruby]
compile = false

[settings.upgrade]

[tools]
buf = "latest"
bun = "latest"
dotnet = "latest"
go = "latest"
hyperfine = "latest"
node = "latest"
npm = "latest"
pi = "latest"
pnpm = "latest"
ruby = "latest"
rust = "latest"
