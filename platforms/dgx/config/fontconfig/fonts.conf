<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Make CaskaydiaMono Nerd Font the system monospace default, as Omarchy does. GNOME's own
     interface fonts are set by platforms/dgx/gnome.sh. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
